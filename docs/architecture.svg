<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690"><defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#16243f"/></marker>
<marker id="arrowS" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#16243f"/></marker>
</defs><rect width="1200" height="690" fill="#ffffff"/><text x="30" y="40" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#16243f" text-anchor="start" >Project RELAY: architecture</text><text x="30" y="62" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#5b6474" text-anchor="start" >One React web app, one Express API, one MongoDB Atlas database. Business rules live in the API only.</text><rect x="30" y="90" width="270" height="520" rx="10" fill="#f7f8fa" stroke="#16243f" stroke-width="1.5"/><text x="46" y="120" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#16243f" text-anchor="start" >Web app</text><text x="46" y="138" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5b6474" text-anchor="start" >React 18 + Vite, plain JavaScript</text><rect x="46" y="156" width="238" height="132" rx="8" fill="#fff" stroke="#c9ced6" stroke-width="1"/><text x="58" y="178" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1d2433" text-anchor="start" >Dispatcher screens</text><text x="58" y="200" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#1d2433" text-anchor="start" >Jobs: counts, alerts, filters</text><text x="58" y="218" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#1d2433" text-anchor="start" >Job page: history, attempts,</text><text x="66" y="236" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#1d2433" text-anchor="start" >assign / reassign / override</text><text x="58" y="254" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#1d2433" text-anchor="start" >New job, Riders</text><text x="58" y="272" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#1d2433" text-anchor="start" >Demo controls: clock, timeout</text><rect x="46" y="302" width="238" height="114" rx="8" fill="#fff" stroke="#c9ced6" stroke-width="1"/><text x="58" y="324" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1d2433" text-anchor="start" >Rider screen</text><text x="58" y="346" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#1d2433" text-anchor="start" >My jobs: accept or decline</text><text x="58" y="364" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#1d2433" text-anchor="start" >Picked up, Delivered</text><text x="58" y="382" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#1d2433" text-anchor="start" >Give a job back</text><text x="58" y="400" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#1d2433" text-anchor="start" >My availability</text><rect x="46" y="430" width="238" height="96" rx="8" fill="#eaf0fb" stroke="#c9ced6" stroke-width="1"/><text x="58" y="452" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1d2433" text-anchor="start" >Data layer</text><text x="58" y="474" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#1d2433" text-anchor="start" >TanStack Query: refresh every 10 s</text><text x="58" y="492" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#1d2433" text-anchor="start" >Loading, error, empty states</text><text x="58" y="510" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#1d2433" text-anchor="start" >Server messages shown as-is</text><line x1="306" y1="350" x2="384" y2="350" stroke="#16243f" stroke-width="2" marker-start="url(#arrowS)" marker-end="url(#arrow)"/><text x="345" y="336" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#16243f" text-anchor="middle" >HTTP + JSON</text><text x="345" y="372" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#5b6474" text-anchor="middle" >Bearer JWT</text><rect x="390" y="90" width="460" height="520" rx="10" fill="#f7f8fa" stroke="#16243f" stroke-width="1.5"/><text x="406" y="120" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#16243f" text-anchor="start" >API</text><text x="406" y="138" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5b6474" text-anchor="start" >Node 20 + Express 5, Mongoose, Zod</text><rect x="406" y="154" width="428" height="72" rx="8" fill="#fff" stroke="#c9ced6" stroke-width="1"/><text x="418" y="175" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1d2433" text-anchor="start" >Middleware</text><text x="418" y="194" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#1d2433" text-anchor="start" >helmet, CORS, JSON body, auth (JWT + role check)</text><text x="418" y="211" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#1d2433" text-anchor="start" >one error handler: { error: { code, message, details } }</text><rect x="406" y="236" width="428" height="72" rx="8" fill="#fff" stroke="#c9ced6" stroke-width="1"/><text x="418" y="257" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1d2433" text-anchor="start" >Routes (thin)</text><text x="418" y="276" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#1d2433" text-anchor="start" >validate input (Zod) -&gt; call one service -&gt; send JSON</text><text x="418" y="293" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#1d2433" text-anchor="start" >auth, riders, jobs, assignments, dashboard, settings, demo, meta</text><rect x="406" y="318" width="428" height="106" rx="8" fill="#fff6d1" stroke="#f4c20d" stroke-width="1"/><text x="418" y="339" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1d2433" text-anchor="start" >Services: each change is one MongoDB transaction</text><text x="418" y="358" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#1d2433" text-anchor="start" >jobs: intake, duplicate check, list and filter, cancel</text><text x="418" y="375" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#1d2433" text-anchor="start" >dispatch: assign, accept, decline, pick up, deliver,</text><text x="430" y="392" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#1d2433" text-anchor="start" >take back, manual queue, expire overdue attempts</text><text x="418" y="409" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#1d2433" text-anchor="start" >recommendations, riders, login (OTP), dashboard, settings</text><rect x="406" y="434" width="428" height="72" rx="8" fill="#e7f2ec" stroke="#1f7a4d" stroke-width="1"/><text x="418" y="455" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1d2433" text-anchor="start" >Domain rules: pure functions, no database</text><text x="418" y="474" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#1d2433" text-anchor="start" >job lifecycle (allowed moves), recommendation scoring,</text><text x="418" y="491" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#1d2433" text-anchor="start" >zones and travel times, rider workload</text><rect x="406.0" y="518" width="208.0" height="74" rx="8" fill="#fff" stroke="#16243f" stroke-width="1.2"/><text x="418.0" y="539" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1d2433" text-anchor="start" >Timeout sweeper</text><text x="418.0" y="559" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#1d2433" text-anchor="start" >every 15 s: expire pending</text><text x="418.0" y="576" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#1d2433" text-anchor="start" >attempts past expiresAt</text><rect x="626.0" y="518" width="208.0" height="74" rx="8" fill="#fff" stroke="#16243f" stroke-width="1.2"/><text x="638.0" y="539" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1d2433" text-anchor="start" >App clock</text><text x="638.0" y="559" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#1d2433" text-anchor="start" >real time + demo offset;</text><text x="638.0" y="576" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#1d2433" text-anchor="start" >workflow time rules read it</text><line x1="856" y1="350" x2="944" y2="350" stroke="#16243f" stroke-width="2" marker-start="url(#arrowS)" marker-end="url(#arrow)"/><text x="900" y="336" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#16243f" text-anchor="middle" >Mongoose</text><text x="900" y="372" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#5b6474" text-anchor="middle" >transactions</text><rect x="950" y="90" width="220" height="520" rx="10" fill="#f7f8fa" stroke="#1f7a4d" stroke-width="1.5"/><text x="966" y="120" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1f7a4d" text-anchor="start" >MongoDB Atlas</text><text x="966" y="138" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5b6474" text-anchor="start" >replica set (for transactions)</text><rect x="966" y="154" width="188" height="52" rx="8" fill="#fff" stroke="#c9ced6" stroke-width="1"/><text x="978" y="175" font-family="'DejaVu Sans Mono', Consolas, Menlo, monospace" font-size="13" font-weight="700" fill="#1d2433" text-anchor="start" >users</text><text x="978" y="194" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5b6474" text-anchor="start" >logins, one per mobile</text><rect x="966" y="217" width="188" height="52" rx="8" fill="#fff" stroke="#c9ced6" stroke-width="1"/><text x="978" y="238" font-family="'DejaVu Sans Mono', Consolas, Menlo, monospace" font-size="13" font-weight="700" fill="#1d2433" text-anchor="start" >riders</text><text x="978" y="257" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5b6474" text-anchor="start" >zones, capacity, current zone</text><rect x="966" y="280" width="188" height="52" rx="8" fill="#fff" stroke="#c9ced6" stroke-width="1"/><text x="978" y="301" font-family="'DejaVu Sans Mono', Consolas, Menlo, monospace" font-size="13" font-weight="700" fill="#1d2433" text-anchor="start" >otpchallenges</text><text x="978" y="320" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5b6474" text-anchor="start" >hashed codes, auto-deleted</text><rect x="966" y="343" width="188" height="52" rx="8" fill="#fff" stroke="#c9ced6" stroke-width="1"/><text x="978" y="364" font-family="'DejaVu Sans Mono', Consolas, Menlo, monospace" font-size="13" font-weight="700" fill="#1d2433" text-anchor="start" >jobs</text><text x="978" y="383" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5b6474" text-anchor="start" >one per order (unique ref)</text><rect x="966" y="406" width="188" height="52" rx="8" fill="#fff" stroke="#c9ced6" stroke-width="1"/><text x="978" y="427" font-family="'DejaVu Sans Mono', Consolas, Menlo, monospace" font-size="13" font-weight="700" fill="#1d2433" text-anchor="start" >assignments</text><text x="978" y="446" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5b6474" text-anchor="start" >attempts, one live per job</text><rect x="966" y="469" width="188" height="52" rx="8" fill="#fff" stroke="#c9ced6" stroke-width="1"/><text x="978" y="490" font-family="'DejaVu Sans Mono', Consolas, Menlo, monospace" font-size="13" font-weight="700" fill="#1d2433" text-anchor="start" >jobevents</text><text x="978" y="509" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5b6474" text-anchor="start" >append-only history</text><rect x="966" y="532" width="188" height="52" rx="8" fill="#fff" stroke="#c9ced6" stroke-width="1"/><text x="978" y="553" font-family="'DejaVu Sans Mono', Consolas, Menlo, monospace" font-size="13" font-weight="700" fill="#1d2433" text-anchor="start" >settings</text><text x="978" y="572" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5b6474" text-anchor="start" >confirmation timeout</text><rect x="30" y="628" width="1140" height="44" rx="8" fill="#16243f" stroke="#16243f" stroke-width="1"/><text x="600" y="655" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#ffffff" text-anchor="middle" >Every job state change writes the job, the assignment attempt, the rider’s reserved capacity and the history event in ONE transaction, so they always agree.</text></svg>